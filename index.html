<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚽ DRIBBLE KING - El Juego Más Adictivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3), 0 0 100px rgba(0, 0, 0, 0.8);
            border: 3px solid #00ff88;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-bottom: 2px solid #00ff88;
        }

        .title {
            font-family: 'Black Ops One', cursive;
            font-size: 28px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 0 10px currentColor;
        }

        .score-val { color: #FFD700; }
        .combo-val { color: #ff4444; }
        .high-val { color: #00ff88; }

        .combo-display {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Black Ops One', cursive;
            font-size: 48px;
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
            opacity: 0;
            transition: all 0.3s;
            z-index: 50;
            pointer-events: none;
        }

        .combo-display.active {
            opacity: 1;
            transform: translateX(-50%) scale(1.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0a0a0a;
            border-top: 2px solid #00ff88;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        button:active {
            transform: translateY(0) scale(0.95);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .btn-jump {
            background: linear-gradient(135deg, #4488ff, #2255cc);
            color: #fff;
        }

        .btn-dash {
            background: linear-gradient(135deg, #ff6644, #cc4422);
            color: #fff;
            position: relative;
        }

        .btn-dash .cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.8);
            width: 0%;
            transition: width 0.1s;
        }

        .btn-reset {
            background: linear-gradient(135deg, #ff4444, #cc2222);
            color: #fff;
        }

        .mobile-controls {
            display: none;
            justify-content: space-between;
            padding: 10px 20px;
            gap: 10px;
        }

        .mobile-btn {
            flex: 1;
            height: 60px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .mobile-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }

        .mobile-btn.active {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
        }

        .instructions {
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #666;
            background: #0a0a0a;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-title {
            font-family: 'Black Ops One', cursive;
            font-size: 56px;
            color: #ff4444;
            text-shadow: 0 0 40px rgba(255, 68, 68, 0.8);
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-over-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .go-stat {
            text-align: center;
        }

        .go-stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
        }

        .go-stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 0 0 20px currentColor;
        }

        .new-record {
            color: #FFD700;
            font-size: 20px;
            animation: blink 0.5s infinite;
            margin-bottom: 20px;
            font-family: 'Black Ops One', cursive;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .skins-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 15px;
            display: none;
            z-index: 60;
            max-width: 200px;
        }

        .skins-panel.show {
            display: block;
        }

        .skins-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #00ff88;
            margin-bottom: 10px;
            text-align: center;
        }

        .skin-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 5px;
        }

        .skin-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .skin-item.selected {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
        }

        .skin-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .skin-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .skin-info {
            flex: 1;
        }

        .skin-name {
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }

        .skin-req {
            font-size: 9px;
            color: #888;
        }

        .btn-skins {
            background: linear-gradient(135deg, #aa44ff, #7722cc);
            color: #fff;
            padding: 8px 16px;
            font-size: 8px;
        }

        .powerup-indicator {
            position: absolute;
            top: 80px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 50;
        }

        .powerup-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid;
            background: rgba(0,0,0,0.7);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .powerup-icon.active {
            opacity: 1;
            animation: float 2s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .fury-mode {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Black Ops One', cursive;
            font-size: 72px;
            color: #ff0000;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 80;
            transition: opacity 0.5s;
        }

        .fury-mode.show {
            opacity: 1;
            animation: furyShake 0.5s infinite;
        }

        @keyframes furyShake {
            0% { transform: translate(-50%, -50%) rotate(-2deg); }
            50% { transform: translate(-50%, -50%) rotate(2deg); }
            100% { transform: translate(-50%, -50%) rotate(-2deg); }
        }

        @media (max-width: 768px) {
            .title { font-size: 18px; }
            .stat-value { font-size: 12px; }
            .controls-area { display: none; }
            .mobile-controls { display: flex; }
            canvas { height: 400px; }
            .game-over-title { font-size: 36px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="title">⚽ DRIBBLE KING</div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Puntos</div>
                    <div class="stat-value score-val" id="scoreDisplay">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Combo</div>
                    <div class="stat-value combo-val" id="comboDisplay">x1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Récord</div>
                    <div class="stat-value high-val" id="highDisplay">0</div>
                </div>
            </div>
        </div>

        <div class="combo-display" id="comboPopup">COMBO x3!</div>
        <div class="fury-mode" id="furyMode">🔥 FURY MODE 🔥</div>

        <div class="powerup-indicator">
            <div class="powerup-icon" id="puSpeed" style="border-color: #4488ff;">⚡</div>
            <div class="powerup-icon" id="puShield" style="border-color: #FFD700;">🛡️</div>
            <div class="powerup-icon" id="puMagnet" style="border-color: #ff44ff;">🧲</div>
        </div>

        <canvas id="gameCanvas" width="1000" height="500"></canvas>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-title">GAME OVER</div>
            <div class="new-record" id="newRecord" style="display:none;">🏆 ¡NUEVO RÉCORD! 🏆</div>
            <div class="game-over-stats">
                <div class="go-stat">
                    <div class="go-stat-label">Puntos</div>
                    <div class="go-stat-value" style="color: #FFD700;" id="finalScore">0</div>
                </div>
                <div class="go-stat">
                    <div class="go-stat-label">Máx Combo</div>
                    <div class="go-stat-value" style="color: #ff4444;" id="finalCombo">x1</div>
                </div>
                <div class="go-stat">
                    <div class="go-stat-label">Récord</div>
                    <div class="go-stat-value" style="color: #00ff88;" id="finalHigh">0</div>
                </div>
            </div>
            <button class="btn-start" onclick="startGame()" style="font-size: 14px; padding: 15px 40px;">▶ JUGAR DE NUEVO</button>
        </div>

        <div class="skins-panel" id="skinsPanel">
            <div class="skins-title">🎨 SKINS</div>
            <div id="skinsList"></div>
        </div>

        <div class="controls-area">
            <div class="btn-group">
                <button class="btn-start" id="btnStart" onclick="startGame()">▶ START</button>
                <button class="btn-reset" id="btnReset" onclick="resetGame()" disabled>🔄 RESET</button>
            </div>
            <div class="btn-group">
                <button class="btn-jump" id="btnJump" onclick="jump()" disabled>SALTAR ⬆️</button>
                <button class="btn-dash" id="btnDash" onclick="dash()" disabled>
                    DASH ⚡
                    <div class="cooldown" id="dashCooldown"></div>
                </button>
            </div>
            <button class="btn-skins" onclick="toggleSkins()">🎨 SKINS</button>
        </div>

        <div class="mobile-controls">
            <div class="mobile-btn" id="mobLeft" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)">⬅️</div>
            <div class="mobile-btn" id="mobJump" ontouchstart="jump()" ontouchend>⬆️</div>
            <div class="mobile-btn" id="mobDash" ontouchstart="dash()" ontouchend>⚡</div>
            <div class="mobile-btn" id="mobRight" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)">➡️</div>
        </div>

        <div class="instructions">
            ← → / A D: Mover | W / ↑ / ESPACIO: Saltar | SHIFT / CLICK DASH: Dash invencible | Esquiva rivales, ¡haz combos!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('dribbleKingHigh')) || 0;
        let combo = 1;
        let maxCombo = 1;
        let gameSpeed = 5;
        let frameCount = 0;
        let enemies = [];
        let particles = [];
        let powerups = [];
        let coins = [];
        let screenShake = 0;
        let furyActive = false;
        let furyTimer = 0;

        // Player
        const player = {
            x: 150,
            y: 350,
            width: 35,
            height: 50,
            vx: 0,
            vy: 0,
            jumping: false,
            dashing: false,
            dashCooldown: 0,
            dashDuration: 0,
            groundY: 350,
            speed: 6,
            jumpPower: -16,
            gravity: 0.7,
            color: '#00ff88',
            skin: 'default',
            shield: false,
            magnet: false,
            magnetTimer: 0,
            shieldTimer: 0,
            speedBoost: false,
            speedTimer: 0,
            invincible: false,
            invincibleTimer: 0
        };

        // Skins system
        const skins = [
            { id: 'default', name: 'Clásico', color: '#00ff88', req: 0, emoji: '👤' },
            { id: 'argentina', name: 'Argentina', color: '#87CEEB', req: 50, emoji: '🇦🇷' },
            { id: 'brasil', name: 'Brasil', color: '#FFD700', req: 100, emoji: '🇧🇷' },
            { id: 'francia', name: 'Francia', color: '#4488ff', req: 200, emoji: '🇫🇷' },
            { id: 'españa', name: 'España', color: '#ff4444', req: 350, emoji: '🇪🇸' },
            { id: 'oro', name: 'Leyenda', color: '#FFD700', req: 500, emoji: '👑' },
            { id: 'fuego', name: 'Infernal', color: '#ff6600', req: 750, emoji: '🔥' },
            { id: 'neon', name: 'Neón', color: '#ff00ff', req: 1000, emoji: '✨' }
        ];

        let unlockedSkins = JSON.parse(localStorage.getItem('dribbleSkins')) || ['default'];
        let currentSkin = localStorage.getItem('dribbleCurrentSkin') || 'default';
        player.skin = currentSkin;
        player.color = skins.find(s => s.id === currentSkin)?.color || '#00ff88';

        // Input state
        const keys = {};
        let moveLeft = false;
        let moveRight = false;

        // Update displays
        document.getElementById('highDisplay').textContent = highScore;

        // Initialize skins panel
        function initSkins() {
            const list = document.getElementById('skinsList');
            list.innerHTML = '';
            skins.forEach(skin => {
                const unlocked = unlockedSkins.includes(skin.id) || highScore >= skin.req;
                const selected = currentSkin === skin.id;
                const div = document.createElement('div');
                div.className = `skin-item ${selected ? 'selected' : ''} ${!unlocked ? 'locked' : ''}`;
                div.innerHTML = `
                    <div class="skin-preview" style="background: ${skin.color};"></div>
                    <div class="skin-info">
                        <div class="skin-name">${skin.emoji} ${skin.name}</div>
                        <div class="skin-req">${unlocked ? '✅ Desbloqueado' : `🔒 Necesita ${skin.req} pts`}</div>
                    </div>
                `;
                if (unlocked) {
                    div.onclick = () => selectSkin(skin.id);
                }
                list.appendChild(div);
            });
        }

        function selectSkin(id) {
            currentSkin = id;
            player.skin = id;
            player.color = skins.find(s => s.id === id)?.color || '#00ff88';
            localStorage.setItem('dribbleCurrentSkin', id);
            if (!unlockedSkins.includes(id)) {
                unlockedSkins.push(id);
                localStorage.setItem('dribbleSkins', JSON.stringify(unlockedSkins));
            }
            initSkins();
        }

        function toggleSkins() {
            document.getElementById('skinsPanel').classList.toggle('show');
            initSkins();
        }

        // Check for new unlocks
        function checkUnlocks() {
            skins.forEach(skin => {
                if (score >= skin.req && !unlockedSkins.includes(skin.id)) {
                    unlockedSkins.push(skin.id);
                    localStorage.setItem('dribbleSkins', JSON.stringify(unlockedSkins));
                    createFloatingText(`¡Desbloqueado: ${skin.name}!`, canvas.width/2, 100, '#FFD700', 30);
                }
            });
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                if (gameRunning) jump();
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                moveLeft = true;
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                moveRight = true;
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                e.preventDefault();
                if (gameRunning) dash();
            }
            if (e.code === 'Enter') {
                if (!gameRunning) {
                    const goScreen = document.getElementById('gameOverScreen');
                    if (goScreen.classList.contains('show')) {
                        startGame();
                    } else if (!document.getElementById('btnStart').disabled) {
                        startGame();
                    }
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = false;
        });

        // Mobile controls
        function setMove(dir, active) {
            if (dir === 'left') moveLeft = active;
            if (dir === 'right') moveRight = active;
        }

        function startGame() {
            gameRunning = true;
            score = 0;
            combo = 1;
            maxCombo = 1;
            gameSpeed = 5;
            frameCount = 0;
            enemies = [];
            particles = [];
            powerups = [];
            coins = [];
            screenShake = 0;
            furyActive = false;
            furyTimer = 0;

            player.x = 150;
            player.y = player.groundY;
            player.vx = 0;
            player.vy = 0;
            player.jumping = false;
            player.dashing = false;
            player.dashCooldown = 0;
            player.dashDuration = 0;
            player.shield = false;
            player.magnet = false;
            player.speedBoost = false;
            player.invincible = false;

            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('comboDisplay').textContent = 'x1';
            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('furyMode').classList.remove('show');
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnJump').disabled = false;
            document.getElementById('btnDash').disabled = false;
            document.getElementById('btnReset').disabled = false;

            // Hide skins panel
            document.getElementById('skinsPanel').classList.remove('show');

            gameLoop();
        }

        function resetGame() {
            gameRunning = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnJump').disabled = true;
            document.getElementById('btnDash').disabled = true;
            document.getElementById('btnReset').disabled = true;
            draw();
        }

        function jump() {
            if (!player.jumping && !player.dashing && gameRunning) {
                player.jumping = true;
                player.vy = player.jumpPower;
                createParticles(player.x + player.width/2, player.y + player.height, 8, '#8B4513', 2);
                createParticles(player.x + player.width/2, player.y + player.height, 5, '#fff', 1);
            }
        }

        function dash() {
            if (player.dashCooldown <= 0 && !player.dashing && gameRunning) {
                player.dashing = true;
                player.dashDuration = 20; // frames
                player.dashCooldown = 120; // 2 seconds at 60fps
                player.invincible = true;
                player.invincibleTimer = 20;

                // Dash effect
                createParticles(player.x, player.y + player.height/2, 15, player.color, 3);
                screenShake = 5;

                // Sound effect visual
                createFloatingText('DASH!', player.x, player.y - 30, '#ff6644', 20);
            }
        }

        function createParticles(x, y, count, color, speed = 2) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * speed * 3,
                    vy: (Math.random() - 0.5) * speed * 3 - 2,
                    life: 40 + Math.random() * 20,
                    maxLife: 60,
                    color: color,
                    size: Math.random() * 4 + 2,
                    type: Math.random() > 0.5 ? 'circle' : 'square'
                });
            }
        }

        function createFloatingText(text, x, y, color, size) {
            particles.push({
                x: x,
                y: y,
                vx: 0,
                vy: -2,
                life: 60,
                maxLife: 60,
                color: color,
                size: size,
                text: text,
                type: 'text'
            });
        }

        function spawnEnemy() {
            const types = ['runner', 'tackler', 'jumper'];
            const type = types[Math.floor(Math.random() * types.length)];
            const lane = Math.random() > 0.5 ? 'ground' : 'air';

            const enemy = {
                x: canvas.width + 50,
                y: lane === 'ground' ? 350 : 250,
                width: 35,
                height: lane === 'ground' ? 50 : 40,
                type: type,
                lane: lane,
                speed: gameSpeed + Math.random() * 2,
                passed: false,
                animation: 0,
                color: type === 'runner' ? '#ff4444' : type === 'tackler' ? '#ff8800' : '#ff00ff'
            };
            enemies.push(enemy);
        }

        function spawnPowerup() {
            const types = ['speed', 'shield', 'magnet'];
            const type = types[Math.floor(Math.random() * types.length)];

            powerups.push({
                x: canvas.width + 50,
                y: 200 + Math.random() * 150,
                width: 30,
                height: 30,
                type: type,
                speed: gameSpeed,
                bob: 0,
                collected: false
            });
        }

        function spawnCoin() {
            coins.push({
                x: canvas.width + 50,
                y: 180 + Math.random() * 200,
                size: 15,
                speed: gameSpeed,
                collected: false,
                bob: Math.random() * Math.PI * 2
            });
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;

            // Increase speed
            if (frameCount % 360 === 0) {
                gameSpeed += 0.3;
            }

            // Fury mode at 50 points
            if (score >= 50 && !furyActive && furyTimer === 0) {
                furyActive = true;
                furyTimer = 300; // 5 seconds
                document.getElementById('furyMode').classList.add('show');
                screenShake = 10;
                createFloatingText('🔥 FURY MODE! 🔥', canvas.width/2, canvas.height/2, '#ff0000', 40);
            }

            if (furyActive) {
                furyTimer--;
                if (furyTimer <= 0) {
                    furyActive = false;
                    document.getElementById('furyMode').classList.remove('show');
                }
            }

            // Player movement
            if (moveLeft && player.x > 20) {
                player.vx = -player.speed * (player.speedBoost ? 1.5 : 1);
            } else if (moveRight && player.x < canvas.width - player.width - 20) {
                player.vx = player.speed * (player.speedBoost ? 1.5 : 1);
            } else {
                player.vx *= 0.8;
            }

            // Dash movement
            if (player.dashing) {
                player.vx = 15;
                player.dashDuration--;
                if (player.dashDuration <= 0) {
                    player.dashing = false;
                }
            }

            player.x += player.vx;

            // Gravity
            if (player.jumping) {
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= player.groundY) {
                    player.y = player.groundY;
                    player.jumping = false;
                    player.vy = 0;
                    createParticles(player.x + player.width/2, player.y + player.height, 5, '#8B4513', 1.5);
                }
            }

            // Cooldowns
            if (player.dashCooldown > 0) player.dashCooldown--;
            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) player.invincible = false;
            }
            if (player.shieldTimer > 0) {
                player.shieldTimer--;
                if (player.shieldTimer <= 0) player.shield = false;
            }
            if (player.magnetTimer > 0) {
                player.magnetTimer--;
                if (player.magnetTimer <= 0) player.magnet = false;
            }
            if (player.speedTimer > 0) {
                player.speedTimer--;
                if (player.speedTimer <= 0) player.speedBoost = false;
            }

            // Update dash cooldown bar
            const cooldownPercent = (1 - player.dashCooldown / 120) * 100;
            document.getElementById('dashCooldown').style.width = cooldownPercent + '%';

            // Update powerup indicators
            document.getElementById('puSpeed').classList.toggle('active', player.speedBoost);
            document.getElementById('puShield').classList.toggle('active', player.shield);
            document.getElementById('puMagnet').classList.toggle('active', player.magnet);

            // Spawn enemies
            const spawnRate = furyActive ? 30 : Math.max(40, 100 - Math.floor(gameSpeed * 3));
            if (frameCount % spawnRate === 0) {
                spawnEnemy();
            }

            // Spawn powerups
            if (frameCount % 400 === 0 && Math.random() > 0.3) {
                spawnPowerup();
            }

            // Spawn coins
            if (frameCount % 60 === 0) {
                spawnCoin();
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.x -= enemy.speed * (furyActive ? 1.5 : 1);
                enemy.animation += 0.2;

                // Jumper enemies jump occasionally
                if (enemy.type === 'jumper' && enemy.lane === 'ground' && Math.random() < 0.02) {
                    enemy.lane = 'air';
                    enemy.y = 250;
                    enemy.vy = -12;
                }
                if (enemy.type === 'jumper' && enemy.lane === 'air') {
                    enemy.vy = (enemy.vy || 0) + 0.6;
                    enemy.y += enemy.vy;
                    if (enemy.y >= 350) {
                        enemy.y = 350;
                        enemy.lane = 'ground';
                        enemy.vy = 0;
                    }
                }

                // Check passed
                if (!enemy.passed && enemy.x + enemy.width < player.x) {
                    enemy.passed = true;
                    const points = 5 * combo;
                    score += points;
                    combo = Math.min(combo + 1, 10);
                    if (combo > maxCombo) maxCombo = combo;

                    document.getElementById('scoreDisplay').textContent = score;
                    document.getElementById('comboDisplay').textContent = 'x' + combo;

                    // Combo popup
                    if (combo >= 3) {
                        const popup = document.getElementById('comboPopup');
                        popup.textContent = `COMBO x${combo}!`;
                        popup.classList.add('active');
                        setTimeout(() => popup.classList.remove('active'), 800);
                        screenShake = Math.min(combo, 5);
                    }

                    createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, 10, '#FFD700', 2);
                    createFloatingText(`+${points}`, enemy.x, enemy.y - 20, '#FFD700', 16);

                    checkUnlocks();
                }

                // Remove off-screen
                if (enemy.x + enemy.width < -50) {
                    enemies.splice(i, 1);
                    // Reset combo if missed too many (optional challenge)
                    continue;
                }

                // Collision
                if (!player.invincible && !player.dashing) {
                    const hitbox = {
                        x: player.x + 5,
                        y: player.y + 5,
                        width: player.width - 10,
                        height: player.height - 10
                    };

                    const enemyHitbox = {
                        x: enemy.x + 5,
                        y: enemy.y + 5,
                        width: enemy.width - 10,
                        height: enemy.height - 10
                    };

                    if (hitbox.x < enemyHitbox.x + enemyHitbox.width &&
                        hitbox.x + hitbox.width > enemyHitbox.x &&
                        hitbox.y < enemyHitbox.y + enemyHitbox.height &&
                        hitbox.y + hitbox.height > enemyHitbox.y) {

                        if (player.shield) {
                            player.shield = false;
                            player.shieldTimer = 0;
                            createParticles(enemy.x, enemy.y, 20, '#FFD700', 3);
                            createFloatingText('SHIELD!', player.x, player.y - 40, '#FFD700', 20);
                            enemies.splice(i, 1);
                            screenShake = 8;
                            continue;
                        } else {
                            gameOver();
                            return;
                        }
                    }
                }
            }

            // Update powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.x -= gameSpeed;
                pu.bob += 0.1;
                pu.y += Math.sin(pu.bob) * 0.5;

                // Magnet effect
                if (player.magnet && !pu.collected) {
                    const dx = player.x - pu.x;
                    const dy = player.y - pu.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150) {
                        pu.x += dx * 0.05;
                        pu.y += dy * 0.05;
                    }
                }

                // Collision with player
                if (!pu.collected &&
                    player.x < pu.x + pu.width &&
                    player.x + player.width > pu.x &&
                    player.y < pu.y + pu.height &&
                    player.y + player.height > pu.y) {

                    pu.collected = true;
                    applyPowerup(pu.type);
                    powerups.splice(i, 1);
                    continue;
                }

                if (pu.x + pu.width < -50) {
                    powerups.splice(i, 1);
                }
            }

            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.x -= gameSpeed;
                coin.bob += 0.1;

                // Magnet effect
                if (player.magnet) {
                    const dx = player.x - coin.x;
                    const dy = player.y - coin.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150) {
                        coin.x += dx * 0.08;
                        coin.y += dy * 0.08;
                    }
                }

                // Collision
                const cx = coin.x;
                const cy = coin.y + Math.sin(coin.bob) * 5;
                const dx = (player.x + player.width/2) - cx;
                const dy = (player.y + player.height/2) - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 30) {
                    score += 2;
                    document.getElementById('scoreDisplay').textContent = score;
                    createParticles(cx, cy, 6, '#FFD700', 2);
                    createFloatingText('+2', cx, cy - 20, '#FFD700', 12);
                    coins.splice(i, 1);
                    continue;
                }

                if (coin.x < -50) {
                    coins.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Screen shake decay
            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.5) screenShake = 0;
        }

        function applyPowerup(type) {
            createParticles(player.x + player.width/2, player.y + player.height/2, 15, '#fff', 3);

            switch(type) {
                case 'speed':
                    player.speedBoost = true;
                    player.speedTimer = 300;
                    createFloatingText('⚡ SPEED!', player.x, player.y - 50, '#4488ff', 20);
                    break;
                case 'shield':
                    player.shield = true;
                    player.shieldTimer = 300;
                    createFloatingText('🛡️ SHIELD!', player.x, player.y - 50, '#FFD700', 20);
                    break;
                case 'magnet':
                    player.magnet = true;
                    player.magnetTimer = 300;
                    createFloatingText('🧲 MAGNET!', player.x, player.y - 50, '#ff44ff', 20);
                    break;
            }
        }

        function draw() {
            ctx.save();

            // Screen shake
            if (screenShake > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * screenShake * 2,
                    (Math.random() - 0.5) * screenShake * 2
                );
            }

            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background grid
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Ground line
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff88';
            ctx.beginPath();
            ctx.moveTo(0, 400);
            ctx.lineTo(canvas.width, 400);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Ground glow
            ctx.fillStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.fillRect(0, 400, canvas.width, 100);

            // Draw coins
            coins.forEach(coin => {
                const cy = coin.y + Math.sin(coin.bob) * 5;
                ctx.fillStyle = '#FFD700';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#FFD700';
                ctx.beginPath();
                ctx.arc(coin.x, cy, coin.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#FFA500';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('$', coin.x, cy + 4);
            });

            // Draw powerups
            powerups.forEach(pu => {
                const colors = {
                    speed: '#4488ff',
                    shield: '#FFD700',
                    magnet: '#ff44ff'
                };
                const emojis = {
                    speed: '⚡',
                    shield: '🛡️',
                    magnet: '🧲'
                };

                ctx.fillStyle = colors[pu.type];
                ctx.shadowBlur = 20;
                ctx.shadowColor = colors[pu.type];
                ctx.beginPath();
                ctx.arc(pu.x + pu.width/2, pu.y + pu.height/2, pu.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(emojis[pu.type], pu.x + pu.width/2, pu.y + pu.height/2 + 7);
            });

            // Draw enemies
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x + enemy.width/2, enemy.y + enemy.height/2);

                // Enemy glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;

                // Body
                ctx.fillStyle = enemy.color;
                ctx.fillRect(-enemy.width/2, -enemy.height/2, enemy.width, enemy.height);

                // Eyes (angry)
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-8, -10, 5, 0, Math.PI * 2);
                ctx.arc(8, -10, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-6, -10, 2, 0, Math.PI * 2);
                ctx.arc(10, -10, 2, 0, Math.PI * 2);
                ctx.fill();

                // Angry eyebrows
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-12, -16);
                ctx.lineTo(-4, -12);
                ctx.moveTo(12, -16);
                ctx.lineTo(4, -12);
                ctx.stroke();

                // Type indicator
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                if (enemy.type === 'tackler') ctx.fillText('💥', 0, 5);
                else if (enemy.type === 'jumper') ctx.fillText('⬆️', 0, 5);
                else ctx.fillText('🏃', 0, 5);

                ctx.shadowBlur = 0;
                ctx.restore();
            });

            // Draw player
            drawPlayer();

            // Draw particles
            particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;

                if (p.type === 'text') {
                    ctx.fillStyle = p.color;
                    ctx.font = `bold ${p.size}px 'Black Ops One'`;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y);
                } else if (p.type === 'square') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;

            // Speed lines when dashing
            if (player.dashing) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const y = player.y + Math.random() * player.height;
                    ctx.beginPath();
                    ctx.moveTo(player.x - 50 - Math.random() * 100, y);
                    ctx.lineTo(player.x, y);
                    ctx.stroke();
                }
            }

            // Fury mode overlay
            if (furyActive) {
                ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + Math.sin(frameCount * 0.1) * 0.05})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.restore();
        }

        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;

            ctx.save();

            // Invincible/dash effect
            if (player.dashing || player.invincible) {
                ctx.globalAlpha = 0.7 + Math.sin(frameCount * 0.5) * 0.3;

                // Ghost trail
                for (let i = 1; i <= 3; i++) {
                    ctx.globalAlpha = 0.2 / i;
                    ctx.fillStyle = player.color;
                    ctx.fillRect(x - i * 20, y, w, h);
                }
                ctx.globalAlpha = 1;
            }

            // Shield effect
            if (player.shield) {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#FFD700';
                ctx.beginPath();
                ctx.arc(x + w/2, y + h/2, Math.max(w, h) * 0.8 + Math.sin(frameCount * 0.1) * 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Magnet effect
            if (player.magnet) {
                ctx.strokeStyle = '#ff44ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(x + w/2, y + h/2, 60 + Math.sin(frameCount * 0.2) * 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Player glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;

            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(x + 5, y + 15, w - 10, h - 30);

            // Stripes based on skin
            if (player.skin === 'argentina') {
                ctx.fillStyle = '#fff';
                ctx.fillRect(x + 10, y + 15, 4, h - 30);
                ctx.fillRect(x + 20, y + 15, 4, h - 30);
            } else if (player.skin === 'brasil') {
                ctx.fillStyle = '#006600';
                ctx.fillRect(x + 12, y + 15, 10, h - 30);
            }

            // Head
            ctx.fillStyle = '#FFDBAC';
            ctx.beginPath();
            ctx.arc(x + w/2, y + 10, 12, 0, Math.PI * 2);
            ctx.fill();

            // Hair
            ctx.fillStyle = '#4A2511';
            ctx.beginPath();
            ctx.arc(x + w/2, y + 3, 12, Math.PI, 0, false);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x + w/2 - 4, y + 8, 2, 0, Math.PI * 2);
            ctx.arc(x + w/2 + 4, y + 8, 2, 0, Math.PI * 2);
            ctx.fill();

            // Mouth (determined smile)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (player.dashing) {
                ctx.arc(x + w/2, y + 14, 4, 0, Math.PI, false); // Open mouth when dashing
            } else {
                ctx.arc(x + w/2, y + 14, 3, 0, Math.PI, false);
            }
            ctx.stroke();

            // Arms
            ctx.strokeStyle = '#FFDBAC';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            if (player.jumping) {
                ctx.moveTo(x + 5, y + 25);
                ctx.lineTo(x - 8, y + 10);
                ctx.moveTo(x + w - 5, y + 25);
                ctx.lineTo(x + w + 8, y + 10);
            } else if (player.dashing) {
                ctx.moveTo(x + 5, y + 25);
                ctx.lineTo(x + w + 10, y + 20); // Forward when dashing
                ctx.moveTo(x + w - 5, y + 25);
                ctx.lineTo(x + w + 15, y + 30);
            } else {
                ctx.moveTo(x + 5, y + 25);
                ctx.lineTo(x - 5, y + 35 + Math.sin(frameCount * 0.2) * 5);
                ctx.moveTo(x + w - 5, y + 25);
                ctx.lineTo(x + w + 5, y + 35 + Math.sin(frameCount * 0.2 + Math.PI) * 5);
            }
            ctx.stroke();

            // Legs
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.beginPath();
            if (player.jumping) {
                ctx.moveTo(x + 12, y + h - 15);
                ctx.lineTo(x + 8, y + h + 5);
                ctx.moveTo(x + w - 12, y + h - 15);
                ctx.lineTo(x + w - 8, y + h - 5);
            } else if (player.dashing) {
                ctx.moveTo(x + 12, y + h - 15);
                ctx.lineTo(x + 20, y + h + 5); // Running pose
                ctx.moveTo(x + w - 12, y + h - 15);
                ctx.lineTo(x + w - 5, y + h - 10);
            } else {
                ctx.moveTo(x + 12, y + h - 15);
                ctx.lineTo(x + 10, y + h + Math.sin(frameCount * 0.3) * 10);
                ctx.moveTo(x + w - 12, y + h - 15);
                ctx.lineTo(x + w - 10, y + h + Math.sin(frameCount * 0.3 + Math.PI) * 10);
            }
            ctx.stroke();

            // Shoes
            ctx.fillStyle = player.skin === 'oro' ? '#FFD700' : '#333';
            if (player.jumping) {
                ctx.fillRect(x + 5, y + h + 3, 10, 5);
                ctx.fillRect(x + w - 15, y + h - 2, 10, 5);
            } else {
                ctx.fillRect(x + 5, y + h + Math.sin(frameCount * 0.3) * 10, 10, 5);
                ctx.fillRect(x + w - 15, y + h + Math.sin(frameCount * 0.3 + Math.PI) * 10, 10, 5);
            }

            // Number
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('10', x + w/2, y + 32);

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            screenShake = 15;

            // Explosion
            createParticles(player.x + player.width/2, player.y + player.height/2, 30, player.color, 4);
            createParticles(player.x + player.width/2, player.y + player.height/2, 20, '#ff4444', 4);
            createParticles(player.x + player.width/2, player.y + player.height/2, 15, '#FFD700', 3);

            // Draw one more frame to show explosion
            draw();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dribbleKingHigh', highScore);
                document.getElementById('newRecord').style.display = 'block';
            } else {
                document.getElementById('newRecord').style.display = 'none';
            }

            document.getElementById('highDisplay').textContent = highScore;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCombo').textContent = 'x' + maxCombo;
            document.getElementById('finalHigh').textContent = highScore;

            setTimeout(() => {
                document.getElementById('gameOverScreen').classList.add('show');
            }, 500);

            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnJump').disabled = true;
            document.getElementById('btnDash').disabled = true;
            document.getElementById('btnReset').disabled = false;
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initial draw
        draw();

        // Check for saved skin
        const savedSkin = skins.find(s => s.id === currentSkin);
        if (savedSkin) {
            player.color = savedSkin.color;
        }
    </script>
</body>
</html>
