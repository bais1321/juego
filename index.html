<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>⚽ DRIBBLE KING - Modo Supervivencia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3), 0 0 100px rgba(0, 0, 0, 0.8);
            border: 3px solid #00ff88;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-bottom: 2px solid #00ff88;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title {
            font-family: 'Black Ops One', cursive;
            font-size: 24px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        .lives-container {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: #ff4444;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #ff4444;
        }

        .stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            color: #fff;
            text-shadow: 0 0 10px currentColor;
        }

        .score-val { color: #FFD700; }
        .combo-val { color: #ff4444; }
        .high-val { color: #00ff88; }

        .combo-display {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Black Ops One', cursive;
            font-size: 48px;
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
            opacity: 0;
            transition: all 0.3s;
            z-index: 50;
            pointer-events: none;
        }

        .combo-display.active {
            opacity: 1;
            transform: translateX(-50%) scale(1.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 400px;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0a0a0a;
            border-top: 2px solid #00ff88;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before { left: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        button:active { transform: translateY(0) scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-start { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        .btn-jump { background: linear-gradient(135deg, #4488ff, #2255cc); color: #fff; }
        .btn-dash { background: linear-gradient(135deg, #ff6644, #cc4422); color: #fff; position: relative; }
        
        .btn-dash .cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.8);
            width: 0%;
            transition: width 0.1s;
        }

        .btn-reset { background: linear-gradient(135deg, #ff4444, #cc2222); color: #fff; }
        .btn-skins { background: linear-gradient(135deg, #aa44ff, #7722cc); color: #fff; padding: 8px 16px; font-size: 8px; }

        /* CONTROLES MÓVILES */
        .mobile-controls {
            display: none;
            background: #111;
            padding: 12px;
            flex-direction: column;
            border-top: 3px solid #00ff88;
            gap: 12px;
        }

        .mobile-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .mobile-block {
            display: flex;
            gap: 12px;
        }

        .mobile-btn {
            width: 72px;
            height: 68px;
            border-radius: 18px;
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.6);
            transition: all 0.05s;
        }

        #mobLeft, #mobRight {
            background: linear-gradient(135deg, #333, #222);
            border: 2px solid #555;
        }
        #mobJump {
            background: linear-gradient(135deg, #4488ff, #1144aa);
            border: 2px solid #66a0ff;
        }
        #mobDash {
            background: linear-gradient(135deg, #ff6644, #aa3311);
            border: 2px solid #ff9988;
        }

        .mobile-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.6);
        }

        /* FILA DE MENÚ MÓVIL INFERIOR */
        .mobile-menu-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .mobile-menu-btn {
            flex: 1;
            padding: 10px 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            text-align: center;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: #fff;
        }
        .mbtn-start { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; font-weight: bold; }
        .mbtn-skins { background: linear-gradient(135deg, #aa44ff, #7722cc); }
        .mbtn-reset { background: linear-gradient(135deg, #ff4444, #cc2222); }

        .instructions {
            text-align: center;
            padding: 8px;
            font-size: 8px;
            color: #666;
            background: #0a0a0a;
            font-family: 'Press Start 2P', cursive;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .game-over-screen.show { display: flex; }

        .game-over-title {
            font-family: 'Black Ops One', cursive;
            font-size: 56px;
            color: #ff4444;
            text-shadow: 0 0 40px rgba(255, 68, 68, 0.8);
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-over-stats { display: flex; gap: 30px; margin-bottom: 30px; }
        .go-stat { text-align: center; }
        .go-stat-label { font-size: 8px; color: #888; text-transform: uppercase; font-family: 'Press Start 2P', cursive; }
        .go-stat-value { font-family: 'Press Start 2P', cursive; font-size: 24px; color: #fff; margin-top: 10px; text-shadow: 0 0 20px currentColor; }

        .new-record { color: #FFD700; font-size: 20px; animation: blink 0.5s infinite; margin-bottom: 20px; font-family: 'Black Ops One', cursive; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .skins-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.95);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 15px;
            display: none;
            z-index: 200;
            width: 260px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
        }
        .skins-panel.show { display: block; }
        .skins-title { font-family: 'Press Start 2P', cursive; font-size: 11px; color: #00ff88; margin-bottom: 12px; text-align: center; letter-spacing: 1px; }
        .skin-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-bottom: 6px; border: 1px solid transparent; }
        .skin-item:hover { background: rgba(255,255,255,0.08); }
        .skin-item.selected { background: rgba(0, 255, 136, 0.15); border: 1px solid #00ff88; }
        .skin-item.locked { opacity: 0.35; cursor: not-allowed; }
        .skin-preview-box { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .skin-info { flex: 1; }
        .skin-name { font-size: 11px; color: #fff; font-weight: bold; font-family: 'Segoe UI', sans-serif; }
        .skin-req { font-size: 8px; color: #00ff88; font-family: 'Press Start 2P', cursive; margin-top: 30px; }

        .powerup-indicator {
            position: absolute;
            top: 80px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 50;
        }

        .powerup-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 2px solid;
            background: rgba(0,0,0,0.7);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .powerup-icon.active { opacity: 1; animation: float 2s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .fury-mode {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Black Ops One', cursive;
            font-size: 42px;
            color: #ff0000;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 80;
            transition: opacity 0.5s;
            text-align: center;
        }
        .fury-mode.show { opacity: 1; animation: furyShake 0.5s infinite; }
        @keyframes furyShake {
            0% { transform: translate(-50%, -50%) rotate(-2deg); }
            50% { transform: translate(-50%, -50%) rotate(2deg); }
            100% { transform: translate(-50%, -50%) rotate(-2deg); }
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            .title { font-size: 18px; }
            .stat-value { font-size: 9px; }
            .stat-label { font-size: 8px; }
            .lives-container { font-size: 9px; padding: 4px 6px; }
            .controls-area { display: none; }
            .mobile-controls { display: flex; }
            canvas { height: 350px; }
            .game-over-title { font-size: 32px; }
            .skins-panel { top: 120px; left: 50%; transform: translateX(-50%); right: auto; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="title">⚽ DRIBBLE KING</div>
            <div class="lives-container" id="livesDisplay">❤️ ❤️ ❤️</div>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Puntos</div>
                    <div class="stat-value score-val" id="scoreDisplay">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Combo</div>
                    <div class="stat-value combo-val" id="comboDisplay">x1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Récord</div>
                    <div class="stat-value high-val" id="highDisplay">0</div>
                </div>
            </div>
        </div>

        <div class="combo-display" id="comboPopup">COMBO x3!</div>
        <div class="fury-mode" id="furyMode">🔥 FURY MODE 🔥</div>

        <div class="powerup-indicator">
            <div class="powerup-icon" id="puSpeed" style="border-color: #4488ff;">⚡</div>
            <div class="powerup-icon" id="puShield" style="border-color: #FFD700;">🛡️</div>
            <div class="powerup-icon" id="puMagnet" style="border-color: #ff44ff;">🧲</div>
        </div>

        <canvas id="gameCanvas" width="1000" height="500"></canvas>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-title">GAME OVER</div>
            <div class="new-record" id="newRecord" style="display:none;">🏆 ¡NUEVO RÉCORD! 🏆</div>
            <div class="game-over-stats">
                <div class="go-stat">
                    <div class="go-stat-label">Puntos</div>
                    <div class="go-stat-value" style="color: #FFD700;" id="finalScore">0</div>
                </div>
                <div class="go-stat">
                    <div class="go-stat-label">Máx Combo</div>
                    <div class="go-stat-value" style="color: #ff4444;" id="finalCombo">x1</div>
                </div>
                <div class="go-stat">
                    <div class="go-stat-label">Récord</div>
                    <div class="go-stat-value" style="color: #00ff88;" id="finalHigh">0</div>
                </div>
            </div>
            <button class="btn-start" onclick="startGame()" style="font-size: 12px; padding: 12px 30px;">▶ JUGAR DE NUEVO</button>
        </div>

        <div class="skins-panel" id="skinsPanel">
            <div class="skins-title">🎨 CAMISOLAS / SKINS</div>
            <div id="skinsList"></div>
        </div>

        <!-- Área de Controles de Computadora -->
        <div class="controls-area">
            <div class="btn-group">
                <button class="btn-start" id="btnStart" onclick="startGame()">▶ START</button>
                <button class="btn-reset" id="btnReset" onclick="resetGame()" disabled>🔄 RESET</button>
            </div>
            <div class="btn-group">
                <button class="btn-jump" id="btnJump" onclick="jump()" disabled>SALTAR ⬆️</button>
                <button class="btn-dash" id="btnDash" onclick="dash()" disabled>
                    DASH ⚡
                    <div class="cooldown" id="dashCooldown"></div>
                </button>
            </div>
            <button class="btn-skins" onclick="toggleSkins()">🎨 SKINS</button>
        </div>

        <!-- CONTROLES MÓVILES + MENÚ ADAPTADO ABAJO -->
        <div class="mobile-controls">
            <div class="mobile-action-row">
                <div class="mobile-block">
                    <div class="mobile-btn" id="mobLeft" onmousedown="setMove('left', true)" onmouseup="setMove('left', false)" ontouchstart="setMove('left', true)" ontouchend="setMove('left', false)">⬅️</div>
                    <div class="mobile-btn" id="mobRight" onmousedown="setMove('right', true)" onmouseup="setMove('right', false)" ontouchstart="setMove('right', true)" ontouchend="setMove('right', false)">➡️</div>
                </div>
                <div class="mobile-block">
                    <div class="mobile-btn" id="mobJump" onmousedown="jump()" ontouchstart="jump()">⬆️</div>
                    <div class="mobile-btn" id="mobDash" onmousedown="dash()" ontouchstart="dash()">⚡</div>
                </div>
            </div>
            
            <div class="mobile-menu-row">
                <button class="mobile-menu-btn mbtn-start" id="mobStart" onclick="startGame()">▶ START</button>
                <button class="mobile-menu-btn mbtn-skins" onclick="toggleSkins()">🎨 SKINS</button>
                <button class="mobile-menu-btn mbtn-reset" id="mobReset" onclick="resetGame()" disabled>🔄 RESET</button>
            </div>
        </div>

        <div class="instructions">
            ← → / A D: Mover | W / ↑ / ESPACIO: Saltar | SHIFT: Dash | ¡Esquiva rivales y derrota a los Jefes cada 100 pts!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('dribbleKingHigh')) || 0;
        let combo = 1;
        let maxCombo = 1;
        let gameSpeed = 5;
        let frameCount = 0;
        let enemies = [];
        let particles = [];
        let powerups = [];
        let coins = [];
        let screenShake = 0;
        let furyActive = false;
        let furyTimer = 0;
        
        let lives = 3;
        let bossMode = false;
        let currentBoss = null;
        let bossProjectiles = [];
        let nextBossMilestone = 100;

        // Player
        const player = {
            x: 150,
            y: 340,
            width: 40,
            height: 60,
            vx: 0,
            vy: 0,
            jumping: false,
            dashing: false,
            dashCooldown: 0,
            dashDuration: 0,
            groundY: 340,
            speed: 6,
            jumpPower: -16,
            gravity: 0.7,
            color: '#00ff88',
            stripeColor: '#00aa55',
            skin: 'default',
            shield: false,
            magnet: false,
            magnetTimer: 0,
            shieldTimer: 0,
            speedBoost: false,
            speedTimer: 0,
            invincible: false,
            invincibleTimer: 0,
            ballAngle: 0
        };

        // Skins Premium con mejores Emojis y colores de Camisolas
        const skins = [
            { id: 'default', name: 'Clásico CR7', color: '#00ff88', stripeColor: '#00aa55', req: 0, emoji: '🟢' },
            { id: 'argentina', name: 'Argentina (D10S)', color: '#87CEEB', stripeColor: '#ffffff', req: 50, emoji: '👑' },
            { id: 'brasil', name: 'Brasil (O Rei)', color: '#FFD700', stripeColor: '#009c3b', req: 100, emoji: '🇧🇷' },
            { id: 'francia', name: 'Francia (Mba)', color: '#1877f2', stripeColor: '#ffffff', req: 200, emoji: '⚡' },
            { id: 'españa', name: 'España (Furia)', color: '#ff4444', stripeColor: '#ffd700', req: 350, emoji: '🏆' },
            { id: 'manchester', name: 'City (Shark)', color: '#6cabdd', stripeColor: '#ffffff', req: 500, emoji: '🦈' },
            { id: 'fuego', name: 'Fuego Infernal', color: '#ff6600', stripeColor: '#330000', req: 750, emoji: '🔥' },
            { id: 'neon', name: 'Galáctico Neón', color: '#ff00ff', stripeColor: '#00ffff', req: 1000, emoji: '🌌' }
        ];

        let unlockedSkins = JSON.parse(localStorage.getItem('dribbleSkins')) || ['default'];
        let currentSkin = localStorage.getItem('dribbleCurrentSkin') || 'default';
        player.skin = currentSkin;
        
        const initialSkin = skins.find(s => s.id === currentSkin) || skins[0];
        player.color = initialSkin.color;
        player.stripeColor = initialSkin.stripeColor;

        const keys = {};
        let moveLeft = false;
        let moveRight = false;

        document.getElementById('highDisplay').textContent = highScore;

        function updateLivesDisplay() {
            let hearts = "";
            for(let i=0; i<lives; i++) { hearts += "❤️ "; }
            if(lives === 0) hearts = "💀 DEAD";
            document.getElementById('livesDisplay').textContent = hearts;
        }

        function initSkins() {
            const list = document.getElementById('skinsList');
            list.innerHTML = '';
            skins.forEach(skin => {
                const unlocked = unlockedSkins.includes(skin.id) || highScore >= skin.req;
                const selected = currentSkin === skin.id;
                const div = document.createElement('div');
                div.className = `skin-item ${selected ? 'selected' : ''} ${!unlocked ? 'locked' : ''}`;
                div.innerHTML = `
                    <div class="skin-preview-box">${skin.emoji}</div>
                    <div class="skin-info">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-req">${unlocked ? '✅ Seleccionar' : `🔒 ${skin.req} pts`}</div>
                    </div>
                `;
                if (unlocked) { div.onclick = () => selectSkin(skin.id); }
                list.appendChild(div);
            });
        }

        function selectSkin(id) {
            currentSkin = id;
            player.skin = id;
            const target = skins.find(s => s.id === id);
            player.color = target.color;
            player.stripeColor = target.stripeColor;
            localStorage.setItem('dribbleCurrentSkin', id);
            if (!unlockedSkins.includes(id)) {
                unlockedSkins.push(id);
                localStorage.setItem('dribbleSkins', JSON.stringify(unlockedSkins));
            }
            initSkins();
        }

        function toggleSkins() {
            document.getElementById('skinsPanel').classList.toggle('show');
            initSkins();
        }

        function checkUnlocks() {
            skins.forEach(skin => {
                if (score >= skin.req && !unlockedSkins.includes(skin.id)) {
                    unlockedSkins.push(skin.id);
                    localStorage.setItem('dribbleSkins', JSON.stringify(unlockedSkins));
                    createFloatingText(`¡Desbloqueado: ${skin.name}!`, canvas.width/2, 100, '#FFD700', 30);
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault(); if (gameRunning) jump();
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveLeft = true; }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveRight = true; }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                e.preventDefault(); if (gameRunning) dash();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = false;
        });

        function setMove(dir, active) {
            if (dir === 'left') moveLeft = active;
            if (dir === 'right') moveRight = active;
        }

        function startGame() {
            gameRunning = true;
            score = 0;
            combo = 1;
            maxCombo = 1;
            gameSpeed = 5;
            frameCount = 0;
            enemies = [];
            particles = [];
            powerups = [];
            coins = [];
            screenShake = 0;
            furyActive = false;
            furyTimer = 0;
            
            lives = 3;
            bossMode = false;
            currentBoss = null;
            bossProjectiles = [];
            nextBossMilestone = 100;
            updateLivesDisplay();

            player.x = 150;
            player.y = player.groundY;
            player.vx = 0;
            player.vy = 0;
            player.jumping = false;
            player.dashing = false;
            player.dashCooldown = 0;
            player.dashDuration = 0;
            player.shield = false;
            player.magnet = false;
            player.speedBoost = false;
            player.invincible = false;
            player.invincibleTimer = 0;

            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('comboDisplay').textContent = 'x1';
            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('furyMode').classList.remove('show');
            
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnJump').disabled = false;
            document.getElementById('btnDash').disabled = false;
            document.getElementById('btnReset').disabled = false;
            
            document.getElementById('mobStart').disabled = true;
            document.getElementById('mobReset').disabled = false;
            
            document.getElementById('skinsPanel').classList.remove('show');

            gameLoop();
        }

        function resetGame() {
            gameRunning = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnJump').disabled = true;
            document.getElementById('btnDash').disabled = true;
            document.getElementById('btnReset').disabled = true;
            
            document.getElementById('mobStart').disabled = false;
            document.getElementById('mobReset').disabled = true;
            draw();
        }

        function jump() {
            if (!player.jumping && !player.dashing && gameRunning) {
                player.jumping = true;
                player.vy = player.jumpPower;
                createParticles(player.x + player.width/2, player.y + player.height, 8, '#8B4513', 2);
            }
        }

        function dash() {
            if (player.dashCooldown <= 0 && !player.dashing && gameRunning) {
                player.dashing = true;
                player.dashDuration = 20;
                player.dashCooldown = 120;
                player.invincible = true;
                player.invincibleTimer = 20;

                createParticles(player.x, player.y + player.height/2, 15, player.color, 3);
                screenShake = 5;
                createFloatingText('DASH!', player.x, player.y - 30, '#ff6644', 20);
            }
        }

        function createParticles(x, y, count, color, speed = 2) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * speed * 3,
                    vy: (Math.random() - 0.5) * speed * 3 - 2,
                    life: 40 + Math.random() * 20,
                    maxLife: 60,
                    color: color,
                    size: Math.random() * 4 + 2,
                    type: 'circle'
                });
            }
        }

        function createFloatingText(text, x, y, color, size) {
            particles.push({
                x: x, y: y, vx: 0, vy: -2, life: 60, maxLife: 60,
                color: color, size: size, text: text, type: 'text'
            });
        }

        function triggerBossBattle() {
            bossMode = true;
            enemies = [];
            document.getElementById('furyMode').textContent = "👹 BOSS BATTLE 👹";
            document.getElementById('furyMode').classList.add('show');
            screenShake = 15;
            
            currentBoss = {
                x: canvas.width + 100,
                y: 130,
                width: 120,
                height: 200,
                maxLife: 100,
                life: 100,
                speed: 3,
                state: 'entering',
                shootCooldown: 0
            };
            
            setTimeout(() => { document.getElementById('furyMode').classList.remove('show'); }, 2000);
        }

        function spawnEnemy() {
            if (bossMode) return;
            const types = ['runner', 'tackler', 'jumper'];
            const type = types[Math.floor(Math.random() * types.length)];
            const lane = Math.random() > 0.5 ? 'ground' : 'air';

            enemies.push({
                x: canvas.width + 50,
                y: lane === 'ground' ? 340 : 230,
                width: 40, height: lane === 'ground' ? 60 : 50,
                type: type, lane: lane,
                speed: gameSpeed + Math.random() * 2,
                passed: false, animation: 0,
                color: type === 'runner' ? '#ff4444' : type === 'tackler' ? '#ff8800' : '#ff00ff'
            });
        }

        function spawnPowerup() {
            const types = ['speed', 'shield', 'magnet'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: canvas.width + 50, y: 200 + Math.random() * 100,
                width: 30, height: 30, type: type, speed: gameSpeed, bob: 0, collected: false
            });
        }

        function spawnCoin() {
            coins.push({
                x: canvas.width + 50, y: 180 + Math.random() * 150,
                size: 12, speed: gameSpeed, collected: false, bob: Math.random() * Math.PI * 2
            });
        }

        function handlePlayerDamage() {
            if (player.invincible) return;

            if (player.shield) {
                player.shield = false;
                player.shieldTimer = 0;
                createParticles(player.x, player.y, 20, '#FFD700', 3);
                createFloatingText('SHIELD!', player.x, player.y - 40, '#FFD700', 20);
                return;
            }

            lives--;
            updateLivesDisplay();
            screenShake = 20;
            createFloatingText('-1 VIDA 💔', player.x, player.y - 40, '#ff0000', 25);
            
            if (lives <= 0) {
                gameOver();
            } else {
                player.invincible = true;
                player.invincibleTimer = 90;
            }
        }

        function update() {
            if (!gameRunning) return;
            frameCount++;

            // Rotación del balón que lleva el jugador
            player.ballAngle += 0.15;

            if (frameCount % 360 === 0 && !bossMode) { gameSpeed += 0.3; }

            if (score >= nextBossMilestone && !bossMode) {
                triggerBossBattle();
                nextBossMilestone += 100; 
            }

            if (bossMode && currentBoss) {
                if (currentBoss.state === 'entering') {
                    currentBoss.x -= currentBoss.speed;
                    if (currentBoss.x <= canvas.width - 180) currentBoss.state = 'fighting';
                } else if (currentBoss.state === 'fighting') {
                    currentBoss.y = 120 + Math.sin(frameCount * 0.05) * 30;
                    currentBoss.life -= 0.05; 
                    currentBoss.shootCooldown--;
                    if (currentBoss.shootCooldown <= 0) {
                        bossProjectiles.push({
                            x: currentBoss.x,
                            y: currentBoss.y + currentBoss.height / 2 + (Math.random() * 60 - 30),
                            radius: 15, vx: -(6 + Math.random() * 4), vy: Math.random() * 2 - 1
                        });
                        currentBoss.shootCooldown = 40;
                    }
                    if (currentBoss.life <= 0) {
                        currentBoss.state = 'leaving';
                        score += 30;
                        document.getElementById('scoreDisplay').textContent = score;
                    }
                } else if (currentBoss.state === 'leaving') {
                    currentBoss.y -= 5;
                    if (currentBoss.y < -currentBoss.height) {
                        bossMode = false; currentBoss = null; bossProjectiles = [];
                    }
                }
            }

            for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                let proj = bossProjectiles[i];
                proj.x += proj.vx; proj.y += proj.vy;
                let distX = Math.abs(proj.x - (player.x + player.width/2));
                let distY = Math.abs(proj.y - (player.y + player.height/2));

                if (distX < (player.width/2 + proj.radius) && distY < (player.height/2 + proj.radius)) {
                    if(!player.dashing) {
                        handlePlayerDamage(); bossProjectiles.splice(i, 1); continue;
                    }
                }
                if (proj.x < -50) bossProjectiles.splice(i, 1);
            }

            if (moveLeft && player.x > 20) {
                player.vx = -player.speed * (player.speedBoost ? 1.5 : 1);
            } else if (moveRight && player.x < canvas.width - player.width - 20) {
                player.vx = player.speed * (player.speedBoost ? 1.5 : 1);
            } else {
                player.vx *= 0.8;
            }

            if (player.dashing) {
                player.vx = 15; player.dashDuration--;
                if (player.dashDuration <= 0) player.dashing = false;
            }
            player.x += player.vx;

            if (player.jumping) {
                player.vy += player.gravity; player.y += player.vy;
                if (player.y >= player.groundY) {
                    player.y = player.groundY; player.jumping = false; player.vy = 0;
                }
            }

            if (player.dashCooldown > 0) player.dashCooldown--;
            if (player.invincibleTimer > 0) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0 && !player.dashing) player.invincible = false;
            }
            if (player.shieldTimer > 0) { player.shieldTimer--; if (player.shieldTimer <= 0) player.shield = false; }
            if (player.magnetTimer > 0) { player.magnetTimer--; if (player.magnetTimer <= 0) player.magnet = false; }
            if (player.speedTimer > 0) { player.speedTimer--; if (player.speedTimer <= 0) player.speedBoost = false; }

            const cooldownPercent = (1 - player.dashCooldown / 120) * 100;
            document.getElementById('dashCooldown').style.width = cooldownPercent + '%';

            document.getElementById('puSpeed').classList.toggle('active', player.speedBoost);
            document.getElementById('puShield').classList.toggle('active', player.shield);
            document.getElementById('puMagnet').classList.toggle('active', player.magnet);

            const spawnRate = Math.max(40, 100 - Math.floor(gameSpeed * 3));
            if (frameCount % spawnRate === 0) spawnEnemy();
            if (frameCount % 400 === 0 && Math.random() > 0.3) spawnPowerup();
            if (frameCount % 60 === 0) spawnCoin();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.x -= enemy.speed;
                enemy.animation += 0.2;

                if (enemy.type === 'jumper' && enemy.lane === 'ground' && Math.random() < 0.02) {
                    enemy.lane = 'air'; enemy.y = 230; enemy.vy = -12;
                }
                if (enemy.type === 'jumper' && enemy.lane === 'air') {
                    enemy.vy = (enemy.vy || 0) + 0.6; enemy.y += enemy.vy;
                    if (enemy.y >= 340) { enemy.y = 340; enemy.lane = 'ground'; enemy.vy = 0; }
                }

                if (!enemy.passed && enemy.x + enemy.width < player.x) {
                    enemy.passed = true;
                    const points = 5 * combo;
                    score += points;
                    combo = Math.min(combo + 1, 10);
                    if (combo > maxCombo) maxCombo = combo;

                    document.getElementById('scoreDisplay').textContent = score;
                    document.getElementById('comboDisplay').textContent = 'x' + combo;

                    if (combo >= 3) {
                        const popup = document.getElementById('comboPopup');
                        popup.textContent = `COMBO x${combo}!`;
                        popup.classList.add('active');
                        setTimeout(() => popup.classList.remove('active'), 800);
                    }
                    createFloatingText(`+${points}`, enemy.x, enemy.y - 20, '#FFD700', 16);
                    checkUnlocks();
                }

                if (enemy.x + enemy.width < -50) { enemies.splice(i, 1); continue; }

                if (!player.invincible && !player.dashing) {
                    const hitbox = { x: player.x + 5, y: player.y + 5, width: player.width - 10, height: player.height - 10 };
                    const enemyHitbox = { x: enemy.x + 5, y: enemy.y + 5, width: enemy.width - 10, height: enemy.height - 10 };

                    if (hitbox.x < enemyHitbox.x + enemyHitbox.width &&
                        hitbox.x + hitbox.width > enemyHitbox.x &&
                        hitbox.y < enemyHitbox.y + enemyHitbox.height &&
                        hitbox.y + hitbox.height > enemyHitbox.y) {
                        handlePlayerDamage(); enemies.splice(i, 1);
                    }
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i]; pu.x -= gameSpeed; pu.bob += 0.1; pu.y += Math.sin(pu.bob) * 0.5;

                if (player.magnet && !pu.collected) {
                    const dx = player.x - pu.x; const dy = player.y - pu.y; const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150) { pu.x += dx * 0.05; pu.y += dy * 0.05; }
                }

                if (!pu.collected && player.x < pu.x + pu.width && player.x + player.width > pu.x && player.y < pu.y + pu.height && player.y + player.height > pu.y) {
                    pu.collected = true; applyPowerup(pu.type); powerups.splice(i, 1); continue;
                }
                if (pu.x + pu.width < -50) powerups.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i]; coin.x -= gameSpeed; coin.bob += 0.1;

                if (player.magnet) {
                    const dx = player.x - coin.x; const dy = player.y - coin.y; const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150) { coin.x += dx * 0.08; coin.y += dy * 0.08; }
                }

                const cx = coin.x; const cy = coin.y + Math.sin(coin.bob) * 5;
                const dx = (player.x + player.width/2) - cx; const dy = (player.y + player.height/2) - cy;
                if (Math.sqrt(dx*dx + dy*dy) < 30) {
                    score += 2; document.getElementById('scoreDisplay').textContent = score;
                    coins.splice(i, 1); continue;
                }
                if (coin.x < -50) coins.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.9;
        }

        function applyPowerup(type) {
            createParticles(player.x + player.width/2, player.y + player.height/2, 15, '#fff', 3);
            if (type === 'speed') { player.speedBoost = true; player.speedTimer = 300; }
            if (type === 'shield') { player.shield = true; player.shieldTimer = 300; }
            if (type === 'magnet') { player.magnet = true; player.magnetTimer = 300; }
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);

            ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Red de fondo (Estética Campo Virtual)
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 400); ctx.stroke();
            }
            for(let j = 0; j < 400; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            // Línea de tierra
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 400); ctx.lineTo(canvas.width, 400); ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 136, 0.03)'; ctx.fillRect(0, 400, canvas.width, 100);

            // Monedas Estilo Estrella/Brillantes
            coins.forEach(coin => {
                const cy = coin.y + Math.sin(coin.bob) * 5;
                ctx.fillStyle = '#FFD700'; ctx.shadowBlur = 10; ctx.shadowColor = '#FFD700';
                ctx.beginPath(); ctx.arc(coin.x, cy, coin.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Items Especiales (Iconos Circulares)
            powerups.forEach(pu => {
                ctx.fillStyle = pu.type === 'speed' ? '#4488ff' : pu.type === 'shield' ? '#FFD700' : '#ff44ff';
                ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath(); ctx.arc(pu.x + pu.width/2, pu.y + pu.height/2, pu.width/2, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let icon = pu.type === 'speed' ? '⚡' : pu.type === 'shield' ? '🛡️' : '🧲';
                ctx.fillText(icon, pu.x + pu.width/2, pu.y + pu.height/2);
            });

            // Enemigos / Defensas Rivales con Camiseta Roja
            enemies.forEach(enemy => {
                ctx.fillStyle = '#ff4444'; ctx.fillRect(enemy.x, enemy.y + 15, enemy.width, enemy.height - 15);
                ctx.fillStyle = '#330000'; ctx.fillRect(enemy.x + 10, enemy.y + 15, enemy.width - 20, enemy.height - 15);
                ctx.fillStyle = '#FFDBAC'; ctx.beginPath(); ctx.arc(enemy.x + enemy.width/2, enemy.y + 10, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = '10px monospace'; ctx.fillText("⚔️", enemy.x + 12, enemy.y + 40);
            });

            // Jefe Final
            if (bossMode && currentBoss) {
                ctx.fillStyle = '#ff0044'; ctx.fillRect(currentBoss.x, currentBoss.y, currentBoss.width, currentBoss.height);
                ctx.fillStyle = '#333'; ctx.fillRect(currentBoss.x, currentBoss.y - 25, currentBoss.width, 10);
                ctx.fillStyle = '#ff0044'; ctx.fillRect(currentBoss.x, currentBoss.y - 25, currentBoss.width * (currentBoss.life / currentBoss.maxLife), 10);
            }

            // Balones de Fuego del Jefe
            bossProjectiles.forEach(proj => {
                ctx.fillStyle = '#ff3300'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff3300';
                ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            drawPlayer();

            // Texto flotante y partículas
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                if (p.type === 'text') {
                    ctx.fillStyle = p.color; ctx.font = `bold ${p.size}px 'Black Ops One'`; ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function drawPlayer() {
            const x = player.x; const y = player.y; const w = player.width; const h = player.height;
            ctx.save();
            
            if (player.invincible && !player.dashing && Math.floor(frameCount / 4) % 2 === 0) ctx.globalAlpha = 0.2;
            
            // Aura del Escudo Activo
            if (player.shield) {
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#FFD700';
                ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w * 0.9, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Cuerpo/Camisola (Con rayas personalizables del equipo seleccionado)
            ctx.fillStyle = player.color; ctx.fillRect(x, y + 20, w, h - 20);
            ctx.fillStyle = player.stripeColor;
            ctx.fillRect(x + 8, y + 20, 6, h - 20);
            ctx.fillRect(x + w - 14, y + 20, 6, h - 20);

            // El Dorsal número 10 en la espalda/pecho
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("10", x + w/2, y + 42);

            // Cabeza bien definida con carita sonriente original
            ctx.fillStyle = '#FFDBAC'; ctx.beginPath(); ctx.arc(x + w/2, y + 10, 11, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(x + w/2 - 4, y + 7, 2, 3); ctx.fillRect(x + w/2 + 2, y + 7, 2, 3);
            ctx.beginPath(); ctx.arc(x + w/2, y + 12, 4, 0, Math.PI); ctx.stroke();

            // EL BALÓN DE FÚTBOL (Girando dinámicamente según la velocidad del juego)
            ctx.save();
            ctx.translate(x + w/2, y + h + 8);
            ctx.rotate(player.ballAngle);
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; ctx.stroke();
            // Cascos del balón tradicionales
            ctx.fillStyle = '#000000';
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
                ctx.beginPath(); ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6, 2.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();

            ctx.restore();
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score; localStorage.setItem('dribbleKingHigh', highScore);
                document.getElementById('newRecord').style.display = 'block';
            }
            document.getElementById('highDisplay').textContent = highScore;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalCombo').textContent = 'x' + maxCombo;
            document.getElementById('finalHigh').textContent = highScore;
            document.getElementById('gameOverScreen').classList.add('show');
            
            document.getElementById('btnStart').disabled = true;
            document.getElementById('mobStart').disabled = true;
            document.getElementById('btnReset').disabled = false;
            document.getElementById('mobReset').disabled = false;
        }

        function gameLoop() {
            if (!gameRunning) return;
            update(); draw(); requestAnimationFrame(gameLoop);
        }

        draw();
    </script>
</body>
</html>
